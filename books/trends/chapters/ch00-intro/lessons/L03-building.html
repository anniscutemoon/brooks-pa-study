<html lang="zh-CN"><head><meta charset="utf-8">
<title>三层楼：趋势 · 区间 · 反转 · L03 图解</title>
<style>
body{margin:0;background:#1b1d21;color:#d7dae0;font:14px/1.7 "PingFang SC","Microsoft YaHei",sans-serif}
.wrap{width:980px;margin:0 auto;padding:18px}
h1{font-size:18px;color:#e8eaed;margin:4px 0}
.mark{display:inline-block;background:#3a2e18;color:#fbbf24;border-radius:4px;padding:1px 8px;font-size:12px;margin-bottom:8px}
.src{color:#7c8590;font-size:12px;margin-bottom:10px}
.stage{background:#23262b;border:1px solid #33373e;border-radius:8px;padding:14px}

<h1>三层楼：这套书三本怎么分工</h1>
<div><span class="mark">自编示意图解（教学重绘，非原书图表）</span></div>
<div class="src">对应原书：《高级趋势技术分析》引言（PDF 第 8、32-33 页）。</div>
<div class="stage">
<svg width="940" height="480" viewBox="0 0 940 480">
  <rect x="0" y="0" width="940" height="480" fill="#23262b"/>
  <!-- 三楼 反转 -->
  <rect x="60" y="30" width="560" height="120" rx="10" fill="#3a2e18" stroke="#f59e0b" stroke-width="2"/>
  <text x="86" y="62" fill="#f59e0b" font-size="17" fontWeight="bold">三楼 · 反转（第 3 本，上下册）</text>
  <text x="86" y="86" fill="#e8d9b8" font-size="13">市场掉头。收益风险比最好，但大部分反转会失败，要会挑</text>
  <polyline points="660,90 720,50 780,50 840,120" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="700" y="140" fill="#8b929e" font-size="12">先上后掉头</text>
  <text x="86" y="110" fill="#8b929e" font-size="12">最后一本学：要用一、二楼的语言才挑得出哪些反转能做</text>
  <!-- 二楼 区间 -->
  <rect x="60" y="175" width="560" height="120" rx="10" fill="#1f2c3d" stroke="#3D7BD9" stroke-width="2"/>
  <text x="86" y="207" fill="#7db3f5" font-size="17" fontWeight="bold">二楼 · 区间（第 2 本）</text>
  <text x="86" y="231" fill="#c4d6f0" font-size="13">市场在打架。突破怎么认、价格被哪些位置吸住、回调怎么数</text>
  <polyline points="660,235 690,215 720,255 750,215 780,255 810,215 840,245" fill="none" stroke="#7db3f5" stroke-width="3"/>
  <text x="700" y="280" fill="#8b929e" font-size="12">横着来回拉锯</text>
  <text x="86" y="255" fill="#8b929e" font-size="12">附赠工具箱：交易数学 + 订单管理（第 2 本第五篇）</text>
  <!-- 一楼 趋势 -->
  <rect x="60" y="320" width="560" height="120" rx="10" fill="#1f2d26" stroke="#2fa35a" stroke-width="2"/>
  <text x="86" y="352" fill="#5ecb8a" font-size="17" fontWeight="bold">一楼 · 趋势（第 1 本）← 我们在这</text>
  <text x="86" y="376" fill="#c9e6d4" font-size="13">市场在走。K 线语言、趋势线与通道、趋势强度、常见趋势形态</text>
  <polyline points="660,420 720,390 760,400 840,340" fill="none" stroke="#5ecb8a" stroke-width="3"/>
  <text x="700" y="450" fill="#8b929e" font-size="12">持续朝一个方向走</text>
  <text x="86" y="400" fill="#8b929e" font-size="12">地基：后面两本书的词汇全部来自这一本</text>
  <!-- 电梯箭头 -->
  <path d="M40,440 L40,50" stroke="#4fc1ff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#4fc1ff" stroke-width="2"/></marker></defs>
  <text x="24" y="250" fill="#4fc1ff" font-size="12" transform="rotate(-90 24 250)">学习顺序</text>
</svg>
<div class="caption">作者原话（PDF 第 33 页）：反转是所有交易类型中收益风险比最佳的，但由于大部分都会失败，交易者需要有所甄选——所以它住在三楼，最后学。</div>
</div>
</div></body></html>
