<title>急速与通道：四幕生命周期 · L07 图解</title>
<style>
body{margin:0;background:#1b1d21;color:#d7dae0;font:14px/1.7 "PingFang SC","Microsoft YaHei",sans-serif}
.wrap{width:980px;margin:0 auto;padding:18px}
h1{font-size:18px;color:#e8eaed;margin:4px 0}
.mark{display:inline-block;background:#3a2e18;color:#fbbf24;border-radius:4px;padding:1px 8px;font-size:12px;margin-bottom:8px}
.src{color:#7c8590;font-size:12px;margin-bottom:10px}
.stage{background:#23262b;border:1px solid #33373e;border-radius:8px;padding:14px;margin-bottom:12px}

<h1>急速与通道：四幕生命周期</h1>
<div><span class="mark">自编示意图解（教学重绘，非原书图表）</span></div>
<div class="src">对应原书：《高级趋势技术分析》第 3 章（PDF 第 82-87 页）。</div>
<div class="stage">
<svg width="920" height="420" viewBox="0 0 920 420">
  <rect x="0" y="0" width="920" height="420" fill="#23262b"/>
  <!-- 幕1 急速 -->
  <polyline points="70,360 110,300 140,240 170,180" fill="none" stroke="#d43a31" stroke-width="3.5"/>
  <text x="120" y="395" fill="#d43a31" font-size="13.5" text-anchor="middle" font-weight="bold">第 1 幕 · 急速突破</text>
  <text x="120" y="60" fill="#9aa1ab" font-size="12" text-anchor="middle">垂直冲刺，几乎不回撤</text>
  <!-- 幕2 回调 -->
  <polyline points="170,180 210,215 240,205" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="205" y="395" fill="#fbbf24" font-size="13.5" text-anchor="middle" font-weight="bold">第 2 幕 · 回调</text>
  <text x="205" y="60" fill="#9aa1ab" font-size="12" text-anchor="middle">岔气，喘口气</text>
  <!-- 幕3 通道 -->
  <polyline points="240,205 300,180 340,190 400,160 440,170 500,140" fill="none" stroke="#d43a31" stroke-width="3"/>
  <line x1="240" y1="228" x2="500" y2="163" stroke="#4fc1ff" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="240" y1="182" x2="500" y2="117" stroke="#4fc1ff" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="370" y="395" fill="#d43a31" font-size="13.5" text-anchor="middle" font-weight="bold">第 3 幕 · 通道</text>
  <text x="370" y="60" fill="#9aa1ab" font-size="12" text-anchor="middle">还在涨，但斜率降低、K线重叠、影线变多</text>
  <text x="370" y="105" fill="#4fc1ff" font-size="12" text-anchor="middle">转弱的多头行情——通道往往是区间的起点</text>
  <!-- 幕4 测试通道底 -->
  <polyline points="500,140 560,190 620,230 700,222 790,190" fill="none" stroke="#2fa35a" stroke-width="3"/>
  <line x1="500" y1="163" x2="700" y2="245" stroke="#4fc1ff" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="620" cy="230" r="6" fill="#4fc1ff"/>
  <text x="620" y="262" fill="#4fc1ff" font-size="12" text-anchor="middle">测试通道起点/下轨</text>
  <text x="640" y="395" fill="#2fa35a" font-size="13.5" text-anchor="middle" font-weight="bold">第 4 幕 · 被拽回 → 区间</text>
  <text x="640" y="60" fill="#9aa1ab" font-size="12" text-anchor="middle">空头在通道底全部平仓 + 多头在通道起点再买</text>
  <text x="640" y="80" fill="#9aa1ab" font-size="12" text-anchor="middle">→ 区间扩大，"急速与通道"走完</text>
  <!-- 起跑类比 -->
  <rect x="60" y="300" width="320" height="56" rx="8" fill="#20262e" stroke="#4fc1ff"/>
  <text x="220" y="323" fill="#dbe2ea" font-size="13" text-anchor="middle">类比：体考 1000 米</text>
  <text x="220" y="345" fill="#9aa1ab" font-size="12" text-anchor="middle">冲刺 → 岔气 → 慢跑 → 被拽回起跑区</text>
</svg>
<div class="caption"><b>所以上升通道可以看成熊旗</b>（原书 PDF 83）：通道往往最终被回撤——价格还会跌回通道里来。看到上升通道别只想"在涨"，先想到"这是个转弱的多头行情，通道底大概率会被测试"。注意是"大概率"不是"必然"：强趋势里通道可以走很远，极少数向上突破通道线加速（约 5 根K线内失败）。</div>
</div>
</div></body></html>
